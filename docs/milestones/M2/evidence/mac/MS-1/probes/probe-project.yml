name: Probes
options:
  deploymentTarget: { iOS: "26.0", macOS: "26.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  MacProbe:
    type: tool
    platform: macOS
    sources: [MacProbe, Shared/Probe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.probe.mac
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Probe"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Probe"
  IOSProbe:
    type: application
    platform: iOS
    sources: [IOSProbe, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.probe.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Probe"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Probe"
