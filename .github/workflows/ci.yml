# Build and test the platform-independent packages on Linux (CLAUDE.md §3, §7).
# This is the check that the Merge Gatekeeper rule G3 needs before it merges Swift code.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tendcore-linux:
    name: TendCore swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain version
        run: swift --version

      - name: Build (warnings are errors)
        run: |
          if [ ! -f Packages/TendCore/Package.swift ]; then
            echo "Packages/TendCore does not exist yet. Nothing to build."
            exit 0
          fi
          swift build --package-path Packages/TendCore -Xswiftc -warnings-as-errors

      - name: Test
        run: |
          if [ ! -f Packages/TendCore/Package.swift ]; then
            echo "Packages/TendCore does not exist yet. Nothing to test."
            exit 0
          fi
          swift test --package-path Packages/TendCore -Xswiftc -warnings-as-errors 2>&1 | tee swift-test.log
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tendcore-linux-test-log
          path: swift-test.log
          if-no-files-found: ignore

  tendingestion-linux:
    name: TendIngestion swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version
      - name: Test TendSourceScan
        shell: bash
        run: |
          if [ ! -f Packages/TendSourceScan/Package.swift ]; then echo "::notice::TendSourceScan not present yet"; exit 0; fi
          swift test --package-path Packages/TendSourceScan -Xswiftc -warnings-as-errors 2>&1 | tee tendsourcescan-test.log
          exit "${PIPESTATUS[0]}"
      - name: Build TendIngestion (warnings are errors)
        shell: bash
        run: |
          if [ ! -f Packages/TendIngestion/Package.swift ]; then echo "::notice::TendIngestion not present yet"; exit 0; fi
          swift build --package-path Packages/TendIngestion -Xswiftc -warnings-as-errors
      - name: Test TendIngestion
        shell: bash
        run: |
          if [ ! -f Packages/TendIngestion/Package.swift ]; then exit 0; fi
          swift test --package-path Packages/TendIngestion -Xswiftc -warnings-as-errors 2>&1 | tee tendingestion-test.log
          exit "${PIPESTATUS[0]}"
      - name: Build tools
        shell: bash
        run: |
          if [ ! -f Tools/TendTools/Package.swift ]; then exit 0; fi
          swift build --package-path Tools/TendTools -Xswiftc -warnings-as-errors
      - name: Test tools (HM-1b)
        shell: bash
        run: |
          if [ ! -f Tools/TendTools/Package.swift ]; then exit 0; fi
          swift test --package-path Tools/TendTools -Xswiftc -warnings-as-errors 2>&1 | tee tendtools-test.log
          exit "${PIPESTATUS[0]}"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tendingestion-linux-test-logs
          path: "*-test.log"
          if-no-files-found: ignore
